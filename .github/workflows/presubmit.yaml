name: presubmit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: [ubuntu-latest]
    strategy:
      matrix:
        go: ["1.26.5"]
    steps:
    - uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4.1.6
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - run: |
        echo "GOPATH=$(go env GOPATH)" >> $GITHUB_ENV
    - run: go version
    - run: ./tools/scripts/cleanup.sh
    - run: |
        python3 -m venv .venv && source .venv/bin/activate
        ./tools/scripts/sync.sh

  e2e-hostpath:
    runs-on: [ubuntu-latest]
    strategy:
      matrix:
        go: ["1.26.5"]
    steps:
    - uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4.1.6
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - run: |
        echo "GOPATH=$(go env GOPATH)" >> $GITHUB_ENV
    - run: go version
    - run: ./tools/scripts/cleanup.sh 2>&1
    - run: |
        python3 -m venv .venv && source .venv/bin/activate
        ./tools/scripts/sync.sh 2>&1
    - run: ./.prow.sh 2>&1
    - run:  grep "Ginkgo ran" -B 4 .prow.sh.log
